# Add this location block inside your existing tengyuanlinye.cn server block.
# It exposes the local FastAPI backend at /job-accelerator/.
# Use the HTTP IP entry for temporary friend demos; switch to HTTPS after ICP/cert is ready.

location /job-accelerator/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
