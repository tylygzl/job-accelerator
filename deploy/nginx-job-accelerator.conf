# Add this location block inside the HTTPS server block for your deployment domain.
# It exposes the local FastAPI backend at /job-accelerator/.
# Keep the public repository free of private deployment hosts and credentials.

location /job-accelerator/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
