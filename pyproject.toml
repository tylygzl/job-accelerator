[project]
name = "job-accelerator"
version = "0.1.0"
description = "Semi-automatic BOSS job matching Chrome extension with a local FastAPI backend."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.126.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.0",
    "pydantic>=2.7.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
legacy = [
    "deepagents>=0.6.12; python_version >= '3.11'",
    "playwright>=1.61.0",
    "playwright-stealth>=2.0.3",
    "python-docx>=1.2.0",
    "streamlit>=1.58.0",
]
