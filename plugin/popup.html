<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #151820; color: #e6e8ee; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #fff; }
    label { display: block; font-size: 12px; color: #aeb6c8; margin-bottom: 6px; }
    input { width: 100%; padding: 8px 10px; font-size: 12px; background: #202636; border: 1px solid #384255; border-radius: 6px; color: #e6e8ee; }
    textarea { width: 100%; min-height: 120px; resize: vertical; padding: 8px 10px; font-size: 12px; line-height: 1.5; background: #202636; border: 1px solid #384255; border-radius: 6px; color: #e6e8ee; font-family: inherit; }
    textarea::placeholder { color: #6f788a; }
    input[type="range"] { padding: 0; accent-color: #2f80ed; }
    .section { margin-top: 12px; }
    .hint { margin: 10px 0 14px; font-size: 12px; line-height: 1.5; color: #aeb6c8; }
    .btn { width: 100%; padding: 10px; border: 0; border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer; background: #2f80ed; color: #fff; }
    .btn + .btn { margin-top: 8px; }
    .btn:hover { background: #2369c9; }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn.secondary { background: #202636; border: 1px solid #384255; color: #d8deea; }
    .btn.secondary:hover { background: #283145; }
    .resume-state { margin-top: 8px; font-size: 12px; color: #8fd19e; }
    .resume-state.empty { color: #8f98aa; }
    .score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .score-row label { margin-bottom: 0; }
    .status { margin-top: 10px; min-height: 18px; font-size: 12px; color: #8fd19e; }
  </style>
</head>
<body>
  <h2>求职加速器</h2>
  <label for="apiUrl">API 地址</label>
  <input id="apiUrl" type="text" value="http://localhost:8000/match">
  <button class="btn secondary" id="checkBackendBtn" type="button">检测后端</button>
  <div class="section">
    <label for="resumeText">简历内容</label>
    <textarea id="resumeText" placeholder="粘贴简历内容到此处..."></textarea>
    <button class="btn secondary" id="saveResumeBtn" type="button">保存简历</button>
    <div class="resume-state empty" id="resumeStatus">未上传简历</div>
  </div>
  <div class="section">
    <div class="score-row">
      <label for="minScore" id="minScoreLabel">匹配度 ≥ 80%</label>
    </div>
    <input id="minScore" type="range" min="50" max="100" step="5" value="80">
  </div>
  <div class="section">
    <label for="excludeKeywords">排除关键词</label>
    <input id="excludeKeywords" type="text" placeholder="排除关键词，逗号分隔（如：培训,保险,销售）">
  </div>
  <div class="section">
    <label for="dailyGoal">今日目标沟通数</label>
    <input id="dailyGoal" type="number" min="1" max="100" step="1" value="10">
  </div>
  <div class="hint">点击后会在 BOSS 页面右侧打开分析面板，后端读取同目录的 skills.json。</div>
  <button class="btn" id="analyzeBtn">分析当前页面岗位</button>
  <button class="btn secondary" id="clearCacheBtn" type="button">清空分析缓存</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
